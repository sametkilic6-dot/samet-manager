<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samet Manager</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,sans-serif;
}
.app{
  max-width:650px;
  margin:auto;
  padding:18px;
}
.logo{
  text-align:center;
  padding:25px 0;
}
.logo h1{
  margin:0;
  font-size:32px;
}
.logo p{
  color:#94a3b8;
}
.card{
  background:#101c2e;
  border:1px solid #24344d;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  margin-top:10px;
  background:#1e2d44;
  color:#fff;
  font-weight:bold;
  font-size:15px;
}
.primary{
  background:#2563eb;
}
.back{
  background:#334155;
}
.hidden{
  display:none;
}
input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid #334155;
  background:#091526;
  color:#fff;
}
.club{
  padding:15px;
  margin-top:10px;
  border:1px solid #2b3d59;
  border-radius:14px;
  background:#0c1829;
}
.club-name{
  font-size:19px;
  font-weight:bold;
}
.club-info{
  color:#94a3b8;
  margin-top:5px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}
.stat{
  background:#091526;
  border-radius:12px;
  padding:13px;
}
.label{
  color:#94a3b8;
  font-size:12px;
}
.value{
  margin-top:5px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<!-- ANA MENÜ -->

<section id="home">

<div class="logo">
<h1>⚽ Samet Manager</h1>
<p>Futbol Menajerlik Simülasyonu</p>
</div>

<div class="card">

<h2>🎮 Kariyer</h2>

<button class="primary" onclick="show('clubs')">
➕ Yeni Kariyer
</button>

<button onclick="loadCareer()">
💾 Kayıtlı Kariyer
</button>

</div>

</section>


<!-- KULÜP SEÇİMİ -->

<section id="clubs" class="hidden">

<button class="back" onclick="show('home')">
← Geri
</button>

<div class="card">

<h2>🏟️ Kulübünü Seç</h2>

<input
id="search"
placeholder="Kulüp ara..."
oninput="renderClubs()"
>

<div id="clubList"></div>

</div>

</section>


<!-- KULÜP DETAY -->

<section id="detail" class="hidden">

<button class="back" onclick="show('clubs')">
← Kulüplere Dön
</button>

<div class="card">

<h2 id="clubName"></h2>

<p id="clubCountry"></p>

<div class="stats">

<div class="stat">
<div class="label">⭐ İtibar</div>
<div class="value" id="clubRep"></div>
</div>

<div class="stat">
<div class="label">💰 Transfer Bütçesi</div>
<div class="value" id="clubBudget"></div>
</div>

<div class="stat">
<div class="label">🎯 Hedef</div>
<div class="value" id="clubGoal"></div>
</div>

<div class="stat">
<div class="label">🏆 Son Başarı</div>
<div class="value" id="clubHistory"></div>
</div>

</div>

<button class="primary" onclick="startCareer()">
🚀 Kariyere Başla
</button>

</div>

</section>


<!-- KARİYER -->

<section id="career" class="hidden">

<div class="logo">

<h1>⚽ Samet Manager</h1>

<p id="date"></p>

</div>

<div class="card">

<h2 id="careerClub"></h2>

<p id="careerLeague"></p>

<div class="stats">

<div class="stat">
<div class="label">💰 Transfer Bütçesi</div>
<div class="value" id="careerBudget"></div>
</div>

<div class="stat">
<div class="label">⭐ Kulüp İtibarı</div>
<div class="value" id="careerRep"></div>
</div>

</div>

</div>

<div class="card">

<h2>🤖 Asistan</h2>

<p>
Hocam, kariyeriniz başladı.
Takımınızı hazırlamaya başlayabilirsiniz.
</p>

</div>

<div class="card">

<h2>📋 Yönetim Merkezi</h2>

<button>👥 Kadro</button>
<button>🔄 Transfer</button>
<button>🏋️ Antrenman</button>
<button>🔎 Scout</button>
<button>📱 Futbol Gündemi</button>
<button>⚽ Maç</button>

</div>

</section>

</div>


<script>

const clubs=[

{
id:1,
name:"Galatasaray",
country:"🇹🇷 Türkiye",
league:"Süper Lig",
rep:88,
budget:35000000,
goal:"Şampiyonluk",
history:"Lig şampiyonluğu"
},

{
id:2,
name:"Fenerbahçe",
country:"🇹🇷 Türkiye",
league:"Süper Lig",
rep:87,
budget:32000000,
goal:"Şampiyonluk",
history:"Şampiyonluk yarışı"
},

{
id:3,
name:"Beşiktaş",
country:"🇹🇷 Türkiye",
league:"Süper Lig",
rep:82,
budget:22000000,
goal:"İlk 3",
history:"Avrupa kupası"
},

{
id:4,
name:"Eyüpspor",
country:"🇹🇷 Türkiye",
league:"Süper Lig",
rep:62,
budget:8000000,
goal:"İlk 8",
history:"Lig yükselişi"
},

{
id:5,
name:"Manchester City",
country:"🇬🇧 İngiltere",
league:"Premier League",
rep:96,
budget:150000000,
goal:"Şampiyonluk",
history:"Premier League"
},

{
id:6,
name:"Real Madrid",
country:"🇪🇸 İspanya",
league:"La Liga",
rep:98,
budget:180000000,
goal:"Şampiyonlar Ligi",
history:"Avrupa şampiyonluğu"
}

];

let selected=null;


function show(page){

document
.querySelectorAll("section")
.forEach(x=>x.classList.add("hidden"));

document
.getElementById(page)
.classList.remove("hidden");

if(page==="clubs") renderClubs();

}


function renderClubs(){

let search=
document
.getElementById("search")
.value
.toLowerCase();

let list=
document.getElementById("clubList");

list.innerHTML="";

clubs
.filter(c=>c.name.toLowerCase().includes(search))
.forEach(c=>{

let div=document.createElement("div");

div.className="club";

div.innerHTML=`
<div class="club-name">
${c.name}
</div>

<div class="club-info">
${c.country} • ${c.league}
</div>
`;

div.onclick=()=>selectClub(c.id);

list.appendChild(div);

});

}


function selectClub(id){

selected=clubs.find(c=>c.id===id);

document.getElementById("clubName").textContent=
selected.name;

document.getElementById("clubCountry").textContent=
selected.country+" • "+selected.league;

document.getElementById("clubRep").textContent=
selected.rep;

document.getElementById("clubBudget").textContent=
money(selected.budget);

document.getElementById("clubGoal").textContent=
selected.goal;

document.getElementById("clubHistory").textContent=
selected.history;

show("detail");

}


function startCareer(){

if(!selected)return;

let career={

clubId:selected.id,

club:selected.name,

league:selected.league,

rep:selected.rep,

budget:selected.budget,

date:"2026-08-19"

};

localStorage.setItem(
"sametCareer",
JSON.stringify(career)
);

loadCareer();

}


function loadCareer(){

let data=
localStorage.getItem("sametCareer");

if(!data){

alert("Henüz kayıtlı kariyer yok.");

return;

}

let career=JSON.parse(data);

document.getElementById("careerClub").textContent=
career.club;

document.getElementById("careerLeague").textContent=
career.league;

document.getElementById("careerBudget").textContent=
money(career.budget);

document.getElementById("careerRep").textContent=
career.rep;

document.getElementById("date").textContent=
dateFormat(career.date);

show("career");

}


function money(number){

return "€"+
new Intl.NumberFormat("de-DE")
.format(number);

}


function dateFormat(value){

return new Date(value)
.toLocaleDateString(
"tr-TR",
{
day:"numeric",
month:"long",
year:"numeric"
}
);

}

</script>

</body>
</html>
