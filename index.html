<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Samet Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #07111f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 18px;
    }

    .logo {
      text-align: center;
      padding: 20px 0 25px;
    }

    .logo h1 {
      margin: 0;
      font-size: 32px;
    }

    .logo p {
      color: #8fa0b8;
      margin-top: 8px;
    }

    .card {
      background: #101c2e;
      border: 1px solid #20304a;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .hidden {
      display: none;
    }

    h2 {
      margin-top: 0;
    }

    .menu-btn {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      border: 0;
      border-radius: 14px;
      background: #1c2b42;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
    }

    .secondary {
      background: #334155;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0b1627;
      color: white;
    }

    .club {
      padding: 15px;
      border: 1px solid #263953;
      border-radius: 14px;
      margin-top: 10px;
      background: #0d1828;
      cursor: pointer;
    }

    .club:hover {
      border-color: #3b82f6;
    }

    .club-name {
      font-size: 19px;
      font-weight: bold;
    }

    .club-info {
      color: #94a3b8;
      margin-top: 5px;
      font-size: 14px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: #0b1627;
      border-radius: 12px;
      padding: 13px;
    }

    .stat-title {
      color: #8fa0b8;
      font-size: 12px;
    }

    .stat-value {
      margin-top: 5px;
      font-weight: bold;
    }

    .back {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .success {
      border-left: 4px solid #22c55e;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ANA MENÜ -->
  <section id="home">

    <div class="logo">
      <h1>⚽ Samet Manager</h1>
      <p>Futbol Menajerlik Simülasyonu</p>
    </div>

    <div class="card">
      <h2>🎮 Kariyer</h2>

      <button class="menu-btn primary" onclick="showPage('clubs')">
        ➕ Yeni Kariyer
      </button>

      <button class="menu-btn" onclick="loadCareer()">
        💾 Kayıtlı Kariyer
      </button>
    </div>

    <div id="savedCareer"></div>

    <div class="footer">
      Samet Manager • V0.2
    </div>

  </section>


  <!-- KULÜP SEÇİMİ -->
  <section id="clubs" class="hidden">

    <button class="back" onclick="showPage('home')">
      ← Geri
    </button>

    <div class="card">

      <h2>🏟️ Kulübünü Seç</h2>

      <input
        id="clubSearch"
        type="text"
        placeholder="Kulüp ara..."
        oninput="renderClubs()"
      >

      <div id="clubList"></div>

    </div>

  </section>


  <!-- KULÜP DETAYI -->
  <section id="clubDetail" class="hidden">

    <button class="back" onclick="showPage('clubs')">
      ← Kulüplere Dön
    </button>

    <div class="card">

      <h2 id="detailName"></h2>

      <p id="detailCountry"></p>

      <div class="stat-grid">

        <div class="stat">
          <div class="stat-title">⭐ Kulüp İtibarı</div>
          <div class="stat-value" id="detailReputation"></div>
        </div>

        <div class="stat">
          <div class="stat-title">💰 Transfer Bütçesi</div>
          <div class="stat-value" id="detailBudget"></div>
        </div>

        <div class="stat">
          <div class="stat-title">🎯 Yönetim Hedefi</div>
          <div class="stat-value" id="detailGoal"></div>
        </div>

        <div class="stat">
          <div class="stat-title">🏆 Son Başarı</div>
          <div class="stat-value" id="detailHistory"></div>
        </div>

      </div>

      <button class="menu-btn primary" onclick="startCareer()">
        🚀 Bu Kulüple Kariyere Başla
      </button>

    </div>

  </section>


  <!-- KARİYER -->
  <section id="career" class="hidden">

    <div class="logo">
      <h1>⚽ Samet Manager</h1>
      <p id="careerDate"></p>
    </div>

    <div class="card success">

      <h2 id="careerClub"></h2>

      <div class="stat-grid">

        <div class="stat">
          <div class="stat-title">🏆 Lig</div>
          <div class="stat-value" id="careerLeague"></div>
        </div>

        <div class="stat">
          <div class="stat-title">💰 Transfer Bütçesi</div>
          <div class="stat-value" id="careerBudget"></div>
        </div>

      </div>

    </div>

    <div class="card">

      <h2>🧠 Asistan</h2>

      <p id="assistantMessage">
        Kariyeriniz başarıyla başladı hocam.
      </p>

    </div>

    <div class="card">

      <h2>📋 Yönetim</h2>

      <button class="menu-btn">👥 Kadro</button>
      <button class="menu-btn">🔄 Transfer</button>
      <button class="menu-btn">🏋️ Antrenman</button>
      <button class="menu-btn">🔎 Scout</button>
      <button class="menu-btn">📱 Futbol Gündemi</button>
      <button class="menu-btn">⚽ Maç</button>

    </div>

  </section>

</div>


<script>

const clubs = [

  {
    id: 1,
    name: "Galatasaray",
    country: "🇹🇷 Türkiye",
    league: "Süper Lig",
    reputation: 88,
    budget: 35000000,
    goal: "Şampiyonluk",
    history: "Lig şampiyonu"
  },

  {
    id: 2,
    name: "Fenerbahçe",
    country: "🇹🇷 Türkiye",
    league: "Süper Lig",
    reputation: 87,
    budget: 32000000,
    goal: "Şampiyonluk",
    history: "Şampiyonluk yarışı"
  },

  {
    id: 3,
    name: "Beşiktaş",
    country: "🇹🇷 Türkiye",
    league: "Süper Lig",
    reputation: 82,
    budget: 22000000,
    goal: "İlk 3",
    history: "Avrupa kupası"
  },

  {
    id: 4,
    name: "Eyüpspor",
    country: "🇹🇷 Türkiye",
    league: "Süper Lig",
    reputation: 62,
    budget: 8000000,
    goal: "İlk 8",
    history: "Lig yükselişi"
  },

  {
    id: 5,
    name: "Manchester City",
    country: "🇬🇧 İngiltere",
    league: "Premier League",
    reputation: 96,
    budget: 150000000,
    goal: "Şampiyonluk",
    history: "Premier League"
  },

  {
    id: 6,
    name: "Real Madrid",
    country: "🇪🇸 İspanya",
    league: "La Liga",
    reputation: 98,
    budget: 180000000,
    goal: "Şampiyonlar Ligi",
    history: "Avrupa şampiyonluğu"
  }

];

let selectedClub = null;

function showPage(page) {

  document.querySelectorAll("section").forEach(section => {
    section.classList.add("hidden");
  });

  document.getElementById(page).classList.remove("hidden");

  if (page === "clubs") {
    renderClubs();
  }

}

function renderClubs() {

  const search =
    document.getElementById("clubSearch").value.toLowerCase();

  const list =
    document.getElementById("clubList");

  const filtered =
    clubs.filter(club =>
      club.name.toLowerCase().includes(search)
    );

  list.innerHTML = "";

  filtered.forEach(club => {

    const div = document.createElement("div");

    div.className = "club";

    div.innerHTML = `
      <div class="club-name">${club.name}</div>
      <div class="club-info">
        ${club.country} • ${club.league}
      </div>
    `;

    div.onclick = () => selectClub(club.id);

    list.appendChild(div);

  });

}

function selectClub(id) {

  selectedClub =
    clubs.find(club => club.id === id);

  document.getElementById("detailName").textContent =
    selectedClub.name;

  document.getElementById("detailCountry").textContent =
    selectedClub.country + " • " + selectedClub.league;

  document.getElementById("detailReputation").textContent =
    selectedClub.reputation;

  document.getElementById("detailBudget").textContent =
    formatMoney(selectedClub.budget);

  document.getElementById("detailGoal").textContent =
    selectedClub.goal;

  document.getElementById("detailHistory").textContent =
    selectedClub.history;

  showPage("clubDetail");

}

function startCareer() {

  if (!selectedClub) return;

  const career = {

    clubId: selectedClub.id,

    clubName: selectedClub.name,

    league: selectedClub.league,

    budget: selectedClub.budget,

    date: "2026-08-19"

  };

  localStorage.setItem(
    "sametManagerCareer",
    JSON.stringify(career)
  );

  loadCareer();

}

function loadCareer() {

  const saved =
    localStorage.getItem("sametManagerCareer");

  if (!saved) {

    alert("Henüz kayıtlı bir kariyer yok.");

    return;

  }

  const career =
    JSON.parse(saved);

  document.getElementById("careerClub").textContent =
    career.clubName;

  document.getElementById("careerLeague").textContent =
    career.league;

  document.getElementById("careerBudget").textContent =
    formatMoney(career.budget);

  document.getElementById("careerDate").textContent =
    formatDate(career.date);

  document.getElementById("assistantMessage").textContent =
    "Kariyeriniz devam ediyor. Sıradaki hedeflerinizi belirleyebilirsiniz.";

  showPage("career");

}

function formatMoney(value) {

  return "€" +
    new Intl.NumberFormat("de-DE").format(value);

}

function formatDate(dateString) {

  const date =
    new Date(dateString);

  return date.toLocaleDateString(
    "tr-TR",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}

</script>

</body>
</html>
